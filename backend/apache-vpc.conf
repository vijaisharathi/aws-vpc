# ==============================================================================
# Apache VirtualHost Configuration with Reverse Proxy
# Project: AWS VPC – Public and Private Subnet Demonstration
# ==============================================================================

<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html

    # Proxy API calls directly to the local Gunicorn Python Flask backend
    ProxyPreserveHost On
    ProxyPass /api http://127.0.0.1:5000/api
    ProxyPassReverse /api http://127.0.0.1:5000/api

    # Serve static frontend dashboard assets
    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # Custom Logging
    ErrorLog ${APACHE_LOG_DIR}/vpc_app_error.log
    CustomLog ${APACHE_LOG_DIR}/vpc_app_access.log combined
</VirtualHost>

